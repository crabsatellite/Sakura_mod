# Mod properties
mod_id=sakura
mod_name=Sakura Mod
mod_license=MIT License
mod_version=1.0.10-1.21.1
mod_authors=Syameimaru Zheng, Bagu_chan
mod_description=A mod that mix Bamboo, WA and MapleTree.  This mod is full of Japanese style, Teishoku, sushi, and lots of foods. New battle styles with your katana and kodachi, Cooking with campfire and cooking pot. New illager with his katana spawn in Bamboo forest and maple forest! New dress: Kimono, yukata and Haori.

# JEI (optional, for recipe viewing)
jei_version=19.21.0.247
